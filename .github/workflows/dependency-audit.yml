name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'server/package.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Apply safe audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Dependency audit summary
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const meta = report.metadata?.vulnerabilities || {};
          console.log('AUDIT_COUNTS', JSON.stringify(meta));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log('AUDIT_VULN', JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              via: (item.via || []).map(v => typeof v === 'string' ? v : ({name:v.name,title:v.title,url:v.url,severity:v.severity,range:v.range})),
              effects: item.effects || [],
              range: item.range,
              nodes: item.nodes || [],
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - name: Commit package-lock.json
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock audited server dependencies'
          git push
