<svg xmlns="http://www.w3.org/2000/svg" width="180" height="220" viewBox="0 0 180 220" role="img" aria-label="O‘zbek AI tur yordamchisi">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#145b45"/>
      <stop offset=".55" stop-color="#0f6f54"/>
      <stop offset="1" stop-color="#0c4435"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#ffd6b2"/>
      <stop offset="1" stop-color="#efaa7c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0b3829" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g id="body">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>

      <!-- legs -->
      <path d="M70 161 C66 177 67 190 70 202 L86 202 L91 161 Z" fill="#202b2a"/>
      <path d="M93 161 C90 179 93 190 96 202 L112 202 L111 160 Z" fill="#202b2a"/>
      <path d="M66 199 C63 203 64 211 72 213 L90 213 C92 207 89 203 84 200 Z" fill="#3a2b25"/>
      <path d="M94 200 C92 205 94 212 101 213 L119 213 C122 207 118 202 111 200 Z" fill="#3a2b25"/>
      <path d="M68 203 H88" stroke="#d6a84a" stroke-width="2"/>
      <path d="M97 203 H116" stroke="#d6a84a" stroke-width="2"/>

      <!-- coat -->
      <path d="M58 91 C48 107 47 137 54 168 C66 174 79 176 90 171 C100 176 115 174 126 166 C130 136 128 107 118 91 C102 83 75 83 58 91 Z" fill="url(#coat)"/>
      <path d="M86 88 L82 170" stroke="#e3b65a" stroke-width="4"/>
      <path d="M94 88 L98 170" stroke="#e3b65a" stroke-width="4"/>
      <path d="M57 99 C67 97 74 101 83 107" stroke="#f7f2e6" stroke-width="3" stroke-dasharray="4 5" opacity=".9"/>
      <path d="M103 106 C111 101 118 99 126 101" stroke="#f7f2e6" stroke-width="3" stroke-dasharray="4 5" opacity=".9"/>
      <path d="M56 126 C67 122 74 127 81 133" stroke="#d54d51" stroke-width="3"/>
      <path d="M101 133 C110 126 119 124 127 127" stroke="#d54d51" stroke-width="3"/>
      <path d="M57 149 C67 145 74 150 81 156" stroke="#f7f2e6" stroke-width="3"/>
      <path d="M101 156 C109 150 118 147 125 150" stroke="#f7f2e6" stroke-width="3"/>
      <rect x="82" y="93" width="17" height="69" rx="6" fill="#f8f3e8"/>
      <path d="M84 116 H97" stroke="#d6a84a" stroke-width="3"/>
      <path d="M84 128 H97" stroke="#d6a84a" stroke-width="3"/>
      <path d="M84 140 H97" stroke="#d6a84a" stroke-width="3"/>

      <!-- right arm on hip -->
      <path d="M116 98 C133 106 137 122 128 139 C124 145 117 145 113 139 C118 129 120 118 113 108 Z" fill="#0f624b"/>
      <ellipse cx="120" cy="139" rx="9" ry="8" fill="url(#skin)"/>

      <!-- waving left arm -->
      <g id="wave" transform-origin="58px 103px">
        <animateTransform attributeName="transform" type="rotate" values="0 58 103;-16 58 103;6 58 103;-13 58 103;0 58 103" keyTimes="0;.22;.45;.7;1" dur="1.7s" repeatCount="indefinite"/>
        <path d="M61 99 C48 102 40 91 35 78 C32 70 38 65 44 69 C50 77 54 83 61 86 Z" fill="#0f624b"/>
        <g transform="translate(31 52)">
          <ellipse cx="12" cy="17" rx="10" ry="12" fill="url(#skin)"/>
          <rect x="8" y="0" width="5" height="17" rx="3" fill="url(#skin)" transform="rotate(-8 10 17)"/>
          <rect x="14" y="1" width="5" height="16" rx="3" fill="url(#skin)" transform="rotate(6 16 17)"/>
          <rect x="19" y="4" width="5" height="14" rx="3" fill="url(#skin)" transform="rotate(15 20 17)"/>
          <rect x="3" y="3" width="5" height="15" rx="3" fill="url(#skin)" transform="rotate(-18 7 17)"/>
        </g>
      </g>

      <!-- neck -->
      <rect x="81" y="75" width="18" height="19" rx="8" fill="url(#skin)"/>

      <!-- head -->
      <ellipse cx="90" cy="55" rx="38" ry="37" fill="url(#skin)"/>

      <!-- hair -->
      <path d="M54 52 C53 26 68 14 90 14 C112 14 126 28 125 50 C116 38 107 34 94 36 C79 39 68 35 58 47 Z" fill="#222020"/>
      <path d="M61 40 C70 25 87 22 103 29 C90 27 77 32 68 43 Z" fill="#322927"/>

      <!-- doppi -->
      <path d="M61 24 C68 7 109 5 119 25 C106 21 74 20 61 24 Z" fill="#171b1a"/>
      <path d="M64 18 C77 11 104 11 116 19" fill="none" stroke="#f1eee7" stroke-width="3"/>
      <path d="M72 15 Q78 10 84 15 Q90 10 96 15 Q102 10 108 15" fill="none" stroke="#4aa27d" stroke-width="2"/>

      <!-- ears -->
      <ellipse cx="54" cy="58" rx="7" ry="10" fill="url(#skin)"/>
      <ellipse cx="126" cy="58" rx="7" ry="10" fill="url(#skin)"/>

      <!-- eyes -->
      <g id="eyes">
        <ellipse cx="76" cy="57" rx="8" ry="10" fill="#fff"/>
        <ellipse cx="105" cy="57" rx="8" ry="10" fill="#fff"/>
        <ellipse cx="77" cy="59" rx="5" ry="6" fill="#54301d"/>
        <ellipse cx="104" cy="59" rx="5" ry="6" fill="#54301d"/>
        <circle cx="78" cy="57" r="2" fill="#fff"/>
        <circle cx="105" cy="57" r="2" fill="#fff"/>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 .12;1 1;1 1" keyTimes="0;.72;.75;.78;1" dur="4.5s" repeatCount="indefinite" additive="sum"/>
      </g>

      <!-- eyebrows -->
      <path d="M68 45 Q76 40 84 44" fill="none" stroke="#2a2422" stroke-width="3" stroke-linecap="round"/>
      <path d="M97 44 Q105 40 113 45" fill="none" stroke="#2a2422" stroke-width="3" stroke-linecap="round"/>

      <!-- nose + smile -->
      <path d="M91 58 Q88 65 93 66" fill="none" stroke="#d68e65" stroke-width="2" stroke-linecap="round"/>
      <path d="M75 72 Q90 85 106 71" fill="#fff" stroke="#9f514a" stroke-width="2" stroke-linecap="round"/>
      <path d="M78 73 Q91 80 103 72" fill="#d85e65" opacity=".45"/>
      <circle cx="65" cy="69" r="5" fill="#ef846e" opacity=".25"/>
      <circle cx="115" cy="69" r="5" fill="#ef846e" opacity=".25"/>
    </g>
  </g>
</svg>